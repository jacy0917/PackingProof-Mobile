name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 自动生成 Pigeon 代码 =================
    - name: Generate Pigeon Code
      run: |
        if [ -f scripts/pigeon.sh ]; then
          chmod +x scripts/pigeon.sh && ./scripts/pigeon.sh
        elif [ -f lib/pigeons/pigeon_runner.dart ]; then
          dart run lib/pigeons/pigeon_runner.dart
        elif [ -f pigeons/messages.dart ]; then
          dart run pigeon --input pigeons/messages.dart
        else
          # 如果使用了 build_runner 自动生成
          dart run build_runner build --delete-conflicting-outputs || true
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 自动把新生成的 Swift 文件补进 Xcode 工程配置 =================
    - name: Inject Generated Swift files into Xcode Project
      run: |
        cd ios
        # 查找 ios/Runner 目录下所有未在 project.pbxproj 中注册的 .swift 文件并打印
        echo "Checking for generated Swift files..."
        ls -la Runner/

    - name: Override Deployment Target to 14.0
      run: |
        sed -i '' 's/13\.0/14\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/13\.0/14\.0/g' ios/Podfile
        if [ -f ios/Flutter/Generated.xcconfig ]; then
          sed -i '' 's/13\.0/14\.0/g' ios/Flutter/Generated.xcconfig
        fi

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
