- name: Export Unsigned IPA
  run: |
    set -e

    APP_PATH="$(find build/Runner.xcarchive/Products/Applications \
      -maxdepth 1 \
      -type d \
      -name '*.app' \
      -print -quit)"

    if [ -z "$APP_PATH" ]; then
      echo "未找到 .app 文件"
      find build/Runner.xcarchive -maxdepth 5 -print
      exit 1
    fi

    rm -rf build/ipa
    mkdir -p build/ipa/Payload
    cp -R "$APP_PATH" build/ipa/Payload/

    cd build/ipa
    zip -r -y ../../TrollStore-iOS-IPA.ipa Payload

    cd ../..
    test -f TrollStore-iOS-IPA.ipa
    unzip -l TrollStore-iOS-IPA.ipa | head -30
