name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 0. 预先创建空文件兜底（指向正确的 Generated 目录） =================
    - name: Ensure Generated PlatformApi.swift Exists
      run: |
        mkdir -p ios/Runner/Generated
        if [ ! -f ios/Runner/Generated/PlatformApi.swift ]; then
          echo "// Auto-generated placeholder" > ios/Runner/Generated/PlatformApi.swift
        fi

    # ================= 1. 执行 Pigeon 代码生成 =================
    - name: Generate Pigeon Code
      run: |
        if [ -f scripts/pigeon.sh ]; then
          chmod +x scripts/pigeon.sh && ./scripts/pigeon.sh
        elif [ -f lib/pigeons/pigeon_runner.dart ]; then
          dart run lib/pigeons/pigeon_runner.dart
        elif [ -f pigeons/pigeon_runner.dart ]; then
          dart run pigeons/pigeon_runner.dart
        else
          dart run build_runner build --delete-conflicting-outputs || true
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 补全 Xcode 工程文件引用 =================
    - name: Inject Generated Files into Xcode Project
      run: |
        cd ios
        sudo gem install xcodeproj
        ruby -e "
        require 'xcodeproj'
        project_path = 'Runner.xcodeproj'
        project = Xcodeproj::Project.open(project_path)
        target = project.targets.first
        runner_group = project.main_group['Runner']
        
        Dir.glob('Runner/**/*.swift').each do |file|
          next if target.source_build_phase.files_references.any? { |ref| ref && ref.path == File.basename(file) }
          file_ref = runner_group.new_file(File.basename(file))
          target.add_file_references([file_ref])
          puts \"Injected #{file} to Xcode Project\"
        end
        project.save
        "

    - name: Override Deployment Target to 14.0
      run: |
        sed -i '' 's/13\.0/14\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/13\.0/14\.0/g' ios/Podfile
        if [ -f ios/Flutter/Generated.xcconfig ]; then
          sed -i '' 's/13\.0/14\.0/g' ios/Flutter/Generated.xcconfig
        fi

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
