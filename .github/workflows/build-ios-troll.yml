    # 1. 必须先通过 Flutter 生成 iOS 构建所需的产物
    - name: Prepare Flutter iOS Assets
      run: flutter build ios --release --no-codesign --target-platform ios

    # 2. 导出 xcarchive
    # 增加 -allowProvisioningUpdates 且确保 Xcode 知道不需要签名
    - name: Build iOS Archive (No Codesign)
      run: |
        xcodebuild archive \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Runner.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          GCC_PREPROCESSOR_DEFINITIONS='$(inherited) SKIP_CODESIGN=1'

    # 3. 打包未签名的 IPA
    - name: Export Unsigned IPA
      run: |
        # 创建 Payload 目录
        mkdir -p build/ipa/Payload
        
        # 查找生成的 .app 文件并移动
        # 使用 find 命令比 if 判断更通用，能直接找到目录下唯一的 .app
        find build/Runner.xcarchive/Products/Applications/ -maxdepth 1 -name "*.app" -exec cp -r {} build/ipa/Payload/ \;
        
        # 打包
        cd build/ipa
        zip -r -y ../../TrollStore-iOS-IPA.ipa Payload/
