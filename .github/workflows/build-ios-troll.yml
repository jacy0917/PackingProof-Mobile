name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 执行 Pigeon 代码生成 =================
    - name: Generate Pigeon Code
      run: |
        mkdir -p ios/Runner/Generated
        if [ -f scripts/pigeon.sh ]; then
          chmod +x scripts/pigeon.sh && ./scripts/pigeon.sh
        elif [ -f lib/pigeons/pigeon_runner.dart ]; then
          dart run lib/pigeons/pigeon_runner.dart
        elif [ -f pigeons/pigeon_runner.dart ]; then
          dart run pigeons/pigeon_runner.dart
        else
          dart run build_runner build --delete-conflicting-outputs || true
        fi
        
        # 保底：若生成完依然没有 PlatformApi.swift，则补一个占位文件
        if [ ! -f ios/Runner/Generated/PlatformApi.swift ]; then
          echo "// Auto-generated placeholder" > ios/Runner/Generated/PlatformApi.swift
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 深度清理 Xcode 项目记录并重新关联 =================
    - name: Sanitize and Fix Xcode Project
      run: |
        cd ios
        sudo gem install xcodeproj
        ruby -e "
        require 'xcodeproj'
        project_path = 'Runner.xcodeproj'
        project = Xcodeproj::Project.open(project_path)
        target = project.targets.first

        # 1. 深度清理所有指向旧路径 Runner/PlatformApi.swift 的废弃引用
        project.files.each do |file_ref|
          if file_ref.path == 'PlatformApi.swift' || file_ref.path == 'Runner/PlatformApi.swift'
            puts \"Removing stale PBXFileReference: #{file_ref.path}\"
            file_ref.remove_from_project
          end
        end

        # 2. 将 Generated 目录及生成的 PlatformApi.swift 重新正确挂载到项目
        runner_group = project.main_group['Runner']
        generated_group = runner_group['Generated'] || runner_group.new_group('Generated', 'Generated')

        Dir.glob('Runner/Generated/*.swift').each do |file_path|
          filename = File.basename(file_path)
          
          # 判断 target 中是否已经存在关联
          already_linked = target.source_build_phase.files_references.any? do |ref|
            ref && ref.path == filename
          end

          unless already_linked
            file_ref = generated_group.new_file(filename)
            target.add_file_references([file_ref])
            puts \"Successfully added #{file_path} to Xcode Project\"
          end
        end

        project.save
        "

    # ================= 3. 统一 iOS Deployment Target 到 15.0 =================
    - name: Override Deployment Target to 15.0
      run: |
        sed -i '' 's/13\.0/15\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/14\.0/15\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/13\.0/15\.0/g' ios/Podfile
        sed -i '' 's/14\.0/15\.0/g' ios/Podfile
        if [ -f ios/Flutter/Generated.xcconfig ]; then
          sed -i '' 's/13\.0/15\.0/g' ios/Flutter/Generated.xcconfig
          sed -i '' 's/14\.0/15\.0/g' ios/Flutter/Generated.xcconfig
        fi

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
