name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # 👇 关键修复 1：将项目文件和生成环境里的 13.0 强行替换为 14.0
    - name: Override Deployment Target to 14.0
      run: |
        sed -i '' 's/13\.0/14\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/13\.0/14\.0/g' ios/Podfile
        if [ -f ios/Flutter/Generated.xcconfig ]; then
          sed -i '' 's/13\.0/14\.0/g' ios/Flutter/Generated.xcconfig
        fi

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # 👇 关键修复 2：构建时显式传入参数强制锁定 14.0
    - name: Build iOS App (No Codesign)
      run: |
        xcodebuild archive \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Runner.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          IPHONEOS_DEPLOYMENT_TARGET=14.0

    - name: Export Unsigned IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/Runner.xcarchive/Products/Applications/Runner.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
