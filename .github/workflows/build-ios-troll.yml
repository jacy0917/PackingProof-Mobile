name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Verify Flutter installation
      run: |
        echo "=== Flutter version ==="
        flutter --version
        echo "=== Flutter path ==="
        which flutter
        echo "=== Current directory ==="
        pwd
        echo "=== List root files ==="
        ls -la $GITHUB_WORKSPACE

    - name: Install dependencies
      run: |
        echo "=== GITHUB_WORKSPACE = $GITHUB_WORKSPACE ==="
        if [ -f $GITHUB_WORKSPACE/pubspec.yaml ]; then
          cd $GITHUB_WORKSPACE
          echo "=== Run flutter clean ==="
          flutter clean
          echo "=== Remove pubspec.lock ==="
          rm -f pubspec.lock
          echo "=== Run flutter pub get ==="
          flutter pub get
        else
          echo "=== ERROR: pubspec.yaml NOT found at $GITHUB_WORKSPACE ==="
          ls -la $GITHUB_WORKSPACE
          exit 1
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 调试：列出 pigeons 目录内容 =================
    - name: List pigeons directory
      run: |
        cd $GITHUB_WORKSPACE
        echo "=== Current directory ==="
        pwd
        echo "=== Contents of pigeons/ (if exists) ==="
        if [ -d pigeons ]; then
          ls -la pigeons/
          find pigeons -type f -name "*.dart" | while read -r file; do
            echo "--- $file ---"
            head -n 20 "$file"
          done
        else
          echo "⚠️ pigeons/ directory not found!"
          echo "=== Searching for other pigeon files ==="
          find . -name "*.dart" | grep -i pigeon || echo "No pigeon files found"
        fi

    # ================= 1. 生成 Pigeon 代码（每个 schema 独立输出） =================
    - name: Generate Pigeon Code
      run: |
        cd $GITHUB_WORKSPACE
        mkdir -p ios/Runner/Generated
        mkdir -p lib/generated
        rm -f ios/Runner/Generated/*.swift
        
        # 查找所有 Pigeon schema 文件（支持多种路径）
        PIGEON_FILES=$(find . -maxdepth 3 -type f -name "*.dart" \( -path "*/pigeons/*" -o -path "*/pigeon/*" \) 2>/dev/null)
        
        if [ -z "$PIGEON_FILES" ]; then
          echo "⚠️ No Pigeon schema files found in pigeons/ or pigeon/ directories"
          echo "Fallback: Running build_runner..."
          dart run build_runner build --delete-conflicting-outputs || true
        else
          echo "=== Found Pigeon schemas: ==="
          echo "$PIGEON_FILES"
          
          for file in $PIGEON_FILES; do
            echo "=== Generating from: $file ==="
            BASENAME=$(basename "$file" .dart)
            SWIFT_OUT="ios/Runner/Generated/${BASENAME}.swift"
            DART_OUT="lib/generated/${BASENAME}.dart"
            
            dart run pigeon \
              --input "$file" \
              --swift_out "$SWIFT_OUT" \
              --dart_out "$DART_OUT" \
              || echo "⚠️ Failed to generate from $file"
            
            if [ -f "$SWIFT_OUT" ]; then
              echo "✅ Generated Swift: $SWIFT_OUT"
              echo "--- First 20 lines ---"
              head -n 20 "$SWIFT_OUT"
              echo "--- Grep for IosCameraHostApi ---"
              grep -i "IosCameraHostApi" "$SWIFT_OUT" || echo "❌ IosCameraHostApi NOT found in $SWIFT_OUT"
              echo "--- Grep for IosCameraOperationTiming ---"
              grep -i "IosCameraOperationTiming" "$SWIFT_OUT" || echo "❌ IosCameraOperationTiming NOT found in $SWIFT_OUT"
            else
              echo "❌ Failed to generate Swift: $SWIFT_OUT"
            fi
            
            if [ -f "$DART_OUT" ]; then
              echo "✅ Generated Dart: $DART_OUT"
            else
              echo "❌ Failed to generate Dart: $DART_OUT"
            fi
          done
        fi
        
        echo "=== All generated Swift files ==="
        ls -la ios/Runner/Generated/ || echo "No Swift files generated"
        
        # 复制到 Runner 根目录
        cp -v ios/Runner/Generated/*.swift ios/Runner/ 2>/dev/null || true
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 同步生成的文件 =================
    - name: Synchronize Generated Swift Files
      run: |
        cd $GITHUB_WORKSPACE
        echo "=== Copying all generated Swift files to Runner ==="
        if [ -d ios/Runner/Generated ]; then
          cp -v ios/Runner/Generated/*.swift ios/Runner/ 2>/dev/null || true
        fi
        echo "=== Swift files in ios/Runner/ ==="
        ls -la ios/Runner/*.swift || echo "No Swift files found"
        echo "=== Checking for IosCameraHostApi in ios/Runner/ ==="
        grep -ri "IosCameraHostApi" ios/Runner/ || echo "❌ IosCameraHostApi not found in any Swift file"

    # ❌ Safe Override Deployment Target to 15.0 已删除（Podfile 已处理）

    - name: Install iOS pods
      run: |
        cd $GITHUB_WORKSPACE/ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: |
        cd $GITHUB_WORKSPACE
        flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        cd $GITHUB_WORKSPACE
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
