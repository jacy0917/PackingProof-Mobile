- name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # 1. 必须先通过 Flutter 生成 iOS 构建所需的产物（App.framework 等）
    - name: Prepare Flutter iOS Assets
      run: flutter build ios --release --no-codesign

    # 2. 导出 xcarchive
    - name: Build iOS Archive (No Codesign)
      run: |
        xcodebuild archive \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Runner.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          IPHONEOS_DEPLOYMENT_TARGET=14.0

    # 3. 打包未签名的 IPA
    - name: Export Unsigned IPA
      run: |
        mkdir -p build/ipa/Payload
        # 使用 *.app 防止名称不匹配，并加入逻辑检查
        if [ -d "build/Runner.xcarchive/Products/Applications/Runner.app" ]; then
          cp -r build/Runner.xcarchive/Products/Applications/Runner.app build/ipa/Payload/
        else
          cp -r build/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        fi
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
