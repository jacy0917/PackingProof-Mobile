name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.47.2'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Verify Flutter installation
      run: |
        echo "=== Flutter version ==="
        flutter --version
        echo "=== Flutter path ==="
        which flutter
        echo "=== Current directory ==="
        pwd
        echo "=== List root files ==="
        ls -la $GITHUB_WORKSPACE

    - name: Install dependencies
      run: |
        echo "=== GITHUB_WORKSPACE = $GITHUB_WORKSPACE ==="
        if [ -f $GITHUB_WORKSPACE/pubspec.yaml ]; then
          cd $GITHUB_WORKSPACE
          echo "=== Run flutter clean ==="
          flutter clean
          echo "=== 使用提交的 pubspec.lock（已移除 ML Kit，锁定 iOS 15.0 兼容版本），不重新解析 ==="
          echo "=== Run flutter pub get ==="
          flutter pub get
        else
          echo "=== ERROR: pubspec.yaml NOT found at $GITHUB_WORKSPACE ==="
          ls -la $GITHUB_WORKSPACE
          exit 1
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 生成 Pigeon 代码 =================
    # 输出路径由 pigeons/platform.dart 中 @ConfigurePigeon 声明（dartOut/swiftOut/kotlinOut），
    # 与提交的生成文件路径一致，禁止按 basename 改名覆盖，否则 Xcode 会找不到 Generated/PlatformApi.swift。
    - name: Generate Pigeon Code
      run: |
        cd $GITHUB_WORKSPACE
        mkdir -p ios/Runner/Generated
        
        PIGEON_FILES=$(find . -maxdepth 3 -type f -name "*.dart" \( -path "*/pigeons/*" -o -path "*/pigeon/*" \) 2>/dev/null)
        
        if [ -z "$PIGEON_FILES" ]; then
          echo "⚠️ No Pigeon schema files found"
          dart run build_runner build --delete-conflicting-outputs || true
        else
          echo "=== Found Pigeon schemas: ==="
          echo "$PIGEON_FILES"
          
          for file in $PIGEON_FILES; do
            echo "=== Generating from: $file ==="
            dart run pigeon --input "$file" || echo "⚠️ Failed to generate from $file"
          done
        fi
        
        echo "=== 校验生成的 Swift / Dart 文件 ==="
        ls -la ios/Runner/Generated/ || echo "❌ 未生成 Swift 文件"
        ls -la lib/platform/generated/ || echo "❌ 未生成 Dart 文件"
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install iOS pods
      run: |
        cd $GITHUB_WORKSPACE/ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 3. 直接使用 xcodebuild 构建（无签名） =================
    - name: Build Unsigned App with xcodebuild
      run: |
        cd $GITHUB_WORKSPACE
        echo "=== Building with xcodebuild (no codesign) ==="
        set -e
        xcodebuild -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/ios \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          OTHER_CODE_SIGN_FLAGS="--signature=0x0"
        echo "=== xcodebuild completed successfully ==="

    - name: List build products
      run: |
        cd $GITHUB_WORKSPACE
        echo "=== Build products directory ==="
        ls -la build/ios/Build/Products/Release-iphoneos/ || echo "Directory not found"
        echo "=== Searching for Runner.app ==="
        find build -name "Runner.app" -type d || echo "Runner.app not found"

    # ================= 4. 打包为 IPA =================
    - name: Package TrollStore IPA
      run: |
        cd $GITHUB_WORKSPACE
        APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "❌ Runner.app not found in build/"
          echo "=== Full build directory tree ==="
          find build -type f -name "*.app" || true
          exit 1
        fi
        echo "✅ Found .app at: $APP_PATH"
        mkdir -p build/ipa/Payload
        cp -r "$APP_PATH" build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/
        echo "✅ IPA created: TrollStore-iOS-IPA.ipa"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
