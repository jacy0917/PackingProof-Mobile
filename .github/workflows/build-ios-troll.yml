name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # 👇 关键修复 1：在 Podfile 尾部注入强制将所有 Target 版本提升至 14.0 的脚本
    - name: Force iOS 14.0 Deployment Target in Podfile
      run: |
        cat << 'EOF' >> ios/Podfile

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            flutter_additional_ios_build_settings(target)
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
            end
          end
        end
        EOF

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # 👇 关键修复 2：在 xcodebuild 命令中显式传入 IPHONEOS_DEPLOYMENT_TARGET=14.0
    - name: Build iOS App (No Codesign)
      run: |
        xcodebuild archive \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Runner.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          IPHONEOS_DEPLOYMENT_TARGET=14.0

    - name: Export Unsigned IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/Runner.xcarchive/Products/Applications/Runner.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
