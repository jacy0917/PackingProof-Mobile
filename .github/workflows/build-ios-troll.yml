name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 精准且不覆盖地生成 Pigeon 代码 =================
    - name: Generate Pigeon Code
      run: |
        mkdir -p ios/Runner/Generated
        rm -f ios/Runner/Generated/PlatformApi.swift
        
        # 搜寻所有可能的 Pigeon schema 定义文件
        FILES=$(find . -maxdepth 3 -type f -name "*.dart" \( -path "*/pigeons/*" -o -path "*/pigeon/*" \))
        
        if [ -n "$FILES" ]; then
          for file in $FILES; do
            echo "Processing Pigeon Schema: $file"
            # 临时生成单个 Swift 文件
            dart run pigeon --input "$file" --swift_out ios/Runner/Generated/temp_api.swift || true
            if [ -f ios/Runner/Generated/temp_api.swift ]; then
              cat ios/Runner/Generated/temp_api.swift >> ios/Runner/Generated/PlatformApi.swift
              rm ios/Runner/Generated/temp_api.swift
            fi
          done
        fi

        # 如果还是没有找到或生成失败，尝试运行项目的原生脚本或 build_runner
        if [ ! -s ios/Runner/Generated/PlatformApi.swift ]; then
          echo "Fallback: Running build_runner..."
          dart run build_runner build --delete-conflicting-outputs || true
        fi

        echo "--- Generated PlatformApi.swift preview ---"
        head -n 20 ios/Runner/Generated/PlatformApi.swift || true
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 物理同步至 Runner 目录 =================
    - name: Synchronize PlatformApi.swift Paths
      run: |
        mkdir -p ios/Runner/Generated
        if [ -f ios/Runner/Generated/PlatformApi.swift ]; then
          cp ios/Runner/Generated/PlatformApi.swift ios/Runner/PlatformApi.swift
        elif [ ! -f ios/Runner/PlatformApi.swift ]; then
          echo "// Fallback placeholder" > ios/Runner/PlatformApi.swift
        fi

    # ❌ 这里删除了 Safe Override Deployment Target to 15.0 步骤

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
