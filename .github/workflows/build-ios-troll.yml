name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v4
      with:
        flutter-version: '3.38.0'

    - name: Install dependencies
      run: flutter pub get

    - name: Build IPA (No Codesign)
      run: flutter build ios --release --no-codesign

    - name: Package as IPA
      run: |
        mkdir -p Payload
        cp -r build/ios/Release-iphoneos/Runner.app Payload/
        zip -r app.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: trollstore-ipa
        path: app.ipa
        retention-days: 7
