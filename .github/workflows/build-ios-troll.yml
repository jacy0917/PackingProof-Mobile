name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 执行 Pigeon 代码生成 =================
    - name: Generate Pigeon Code
      run: |
        mkdir -p ios/Runner/Generated
        if [ -f scripts/pigeon.sh ]; then
          chmod +x scripts/pigeon.sh && ./scripts/pigeon.sh
        elif [ -f lib/pigeons/pigeon_runner.dart ]; then
          dart run lib/pigeons/pigeon_runner.dart
        elif [ -f pigeons/pigeon_runner.dart ]; then
          dart run pigeons/pigeon_runner.dart
        else
          dart run build_runner build --delete-conflicting-outputs || true
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 强行双重满足 Xcode 路径需求 =================
    - name: Synchronize PlatformApi.swift Paths
      run: |
        mkdir -p ios/Runner/Generated
        
        # 情况 A：如果 Pigeon 生成在了 Generated 目录下，复制一份到 ios/Runner/ 满足旧引用
        if [ -f ios/Runner/Generated/PlatformApi.swift ]; then
          cp ios/Runner/Generated/PlatformApi.swift ios/Runner/PlatformApi.swift
        # 情况 B：如果两边都没有，创建一个空的 Swift 类文件填补，防止 Xcode 报错
        elif [ ! -f ios/Runner/PlatformApi.swift ]; then
          echo "// Auto-generated placeholder" > ios/Runner/PlatformApi.swift
          echo "// Auto-generated placeholder" > ios/Runner/Generated/PlatformApi.swift
        fi

    # ================= 3. 统一 iOS Deployment Target 到 15.0 =================
    - name: Override Deployment Target to 15.0
      run: |
        sed -i '' 's/13\.0/15\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/14\.0/15\.0/g' ios/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/13\.0/15\.0/g' ios/Podfile
        sed -i '' 's/14\.0/15\.0/g' ios/Podfile
        if [ -f ios/Flutter/Generated.xcconfig ]; then
          sed -i '' 's/13\.0/15\.0/g' ios/Flutter/Generated.xcconfig
          sed -i '' 's/14\.0/15\.0/g' ios/Flutter/Generated.xcconfig
        fi

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
