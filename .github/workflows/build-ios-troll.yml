name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Install dependencies
      run: flutter pub get
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 强制生成真正的 Pigeon 接口代码 =================
    - name: Generate Pigeon Code
      run: |
        mkdir -p ios/Runner/Generated
        
        # 显式尝试项目所有可能的 Pigeon 命令行进行强行生成
        if [ -f scripts/pigeon.sh ]; then
          chmod +x scripts/pigeon.sh && ./scripts/pigeon.sh
        elif [ -f lib/pigeons/pigeon_runner.dart ]; then
          dart run lib/pigeons/pigeon_runner.dart
        elif [ -f pigeons/pigeon_runner.dart ]; then
          dart run pigeons/pigeon_runner.dart
        else
          # 直接调用官方命令行直接指定生成 Swift 输出目标
          dart run pigeon \
            --input pigeons/messages.dart \
            --swift_out ios/Runner/Generated/PlatformApi.swift || \
          dart run pigeon \
            --input lib/pigeons/messages.dart \
            --swift_out ios/Runner/Generated/PlatformApi.swift || true
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 物理同步至 Runner 目录 =================
    - name: Synchronize PlatformApi.swift Paths
      run: |
        mkdir -p ios/Runner/Generated
        
        # 如果 Generated 里面生成出了实际文件，同步到 Runner 目录满足原生 Swift 依赖
        if [ -f ios/Runner/Generated/PlatformApi.swift ]; then
          cp ios/Runner/Generated/PlatformApi.swift ios/Runner/PlatformApi.swift
        fi

    # ================= 3. 兼容调整 Deployment Target 到 15.0 =================
    - name: Safe Override Deployment Target to 15.0
      run: |
        ruby -e '
          files = [
            "ios/Runner.xcodeproj/project.pbxproj",
            "ios/Podfile",
            "ios/Flutter/Generated.xcconfig"
          ]
          files.each do |f|
            next unless File.exist?(f)
            text = File.read(f)
            new_text = text.gsub("13.0", "15.0").gsub("14.0", "15.0")
            File.open(f, "w") { |file| file.puts new_text }
            puts "Updated #{f} target to 15.0"
          end
        '

    - name: Install iOS pods
      run: |
        cd ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Build Unsigned IPA for TrollStore
      run: flutter build ipa --release --no-codesign

    - name: Package TrollStore IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
