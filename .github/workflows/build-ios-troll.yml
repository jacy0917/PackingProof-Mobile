name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    - name: Verify Flutter installation
      run: |
        echo "=== Flutter version ==="
        flutter --version
        echo "=== Flutter path ==="
        which flutter
        echo "=== Current directory ==="
        pwd
        echo "=== List root files ==="
        ls -la $GITHUB_WORKSPACE

    - name: Install dependencies
      run: |
        echo "=== GITHUB_WORKSPACE = $GITHUB_WORKSPACE ==="
        if [ -f $GITHUB_WORKSPACE/pubspec.yaml ]; then
          cd $GITHUB_WORKSPACE
          echo "=== Run flutter clean ==="
          flutter clean
          echo "=== Remove pubspec.lock ==="
          rm -f pubspec.lock
          echo "=== Run flutter pub get ==="
          flutter pub get
        else
          echo "=== ERROR: pubspec.yaml NOT found at $GITHUB_WORKSPACE ==="
          ls -la $GITHUB_WORKSPACE
          exit 1
        fi
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 1. 生成 Pigeon 代码 =================
    - name: Generate Pigeon Code
      run: |
        cd $GITHUB_WORKSPACE
        mkdir -p ios/Runner/Generated
        mkdir -p lib/generated
        rm -f ios/Runner/Generated/*.swift
        
        PIGEON_FILES=$(find . -maxdepth 3 -type f -name "*.dart" \( -path "*/pigeons/*" -o -path "*/pigeon/*" \) 2>/dev/null)
        
        if [ -z "$PIGEON_FILES" ]; then
          echo "⚠️ No Pigeon schema files found"
          dart run build_runner build --delete-conflicting-outputs || true
        else
          echo "=== Found Pigeon schemas: ==="
          echo "$PIGEON_FILES"
          
          for file in $PIGEON_FILES; do
            echo "=== Generating from: $file ==="
            BASENAME=$(basename "$file" .dart)
            SWIFT_OUT="ios/Runner/Generated/${BASENAME}.swift"
            DART_OUT="lib/generated/${BASENAME}.dart"
            
            dart run pigeon \
              --input "$file" \
              --swift_out "$SWIFT_OUT" \
              --dart_out "$DART_OUT" \
              || echo "⚠️ Failed to generate from $file"
            
            if [ -f "$SWIFT_OUT" ]; then
              echo "✅ Generated Swift: $SWIFT_OUT"
            else
              echo "❌ Failed to generate Swift: $SWIFT_OUT"
            fi
          done
        fi
        
        echo "=== All generated Swift files ==="
        ls -la ios/Runner/Generated/ || echo "No Swift files generated"
        
        cp -v ios/Runner/Generated/*.swift ios/Runner/ 2>/dev/null || true
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 2. 同步生成的文件 =================
    - name: Synchronize Generated Swift Files
      run: |
        cd $GITHUB_WORKSPACE
        if [ -d ios/Runner/Generated ]; then
          cp -v ios/Runner/Generated/*.swift ios/Runner/ 2>/dev/null || true
        fi
        echo "=== Swift files in ios/Runner/ ==="
        ls -la ios/Runner/*.swift || echo "No Swift files found"

    - name: Install iOS pods
      run: |
        cd $GITHUB_WORKSPACE/ios
        pod install --repo-update
      env:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    # ================= 3. 直接使用 xcodebuild 构建（无签名） =================
    - name: Build Unsigned App with xcodebuild
      run: |
        cd $GITHUB_WORKSPACE
        echo "=== Building with xcodebuild (no codesign) ==="
        xcodebuild -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/ios \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          || { echo "xcodebuild failed"; exit 1; }

    # ================= 4. 打包为 IPA =================
    - name: Package TrollStore IPA
      run: |
        cd $GITHUB_WORKSPACE
        APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"
        if [ ! -d "$APP_PATH" ]; then
          echo "❌ Runner.app not found at $APP_PATH"
          # 尝试使用 find 查找
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app not found anywhere in build/"
            exit 1
          fi
        fi
        echo "✅ Found .app at: $APP_PATH"
        mkdir -p build/ipa/Payload
        cp -r "$APP_PATH" build/ipa/Payload/
        cd build/ipa
        zip -r ../../TrollStore-iOS-IPA.ipa Payload/
        echo "✅ IPA created: TrollStore-iOS-IPA.ipa"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-iOS-IPA
        path: TrollStore-iOS-IPA.ipa
        retention-days: 7
