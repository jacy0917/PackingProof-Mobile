name: packing_proof_mobile
description: "面向小型电商商家的本地面单识别与连续录像工具。"
publish_to: 'none'

version: 0.5.25+11042

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  camera: ^0.12.0+2
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.3
  video_player: ^2.13.0
  wakelock_plus: ^1.7.0
  camera_android: 0.10.11
  flutter_tts: 4.2.5
  audioplayers: 6.8.1
  crypto: ^3.0.6
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  share_plus:
    hosted: https://pub.dev
    version: 13.3.0
  qr_flutter: ^4.1.0
  # 条码扫描（指定 0.14.2 版本以支持 iOS 14.0）
  google_mlkit_barcode_scanning: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2
  flutter_edge_tts: 0.0.2
  pigeon: 27.3.2
  wakelock_plus_platform_interface: ^1.6.0
  flutter_lints: ^6.0.0

dependency_overrides:
  share_plus_platform_interface:
    hosted: https://pub.dev
    version: 7.2.0
  video_player_android:
    path: plugins/video_player_android

flutter:
  uses-material-design: true
  assets:
    - assets/images/app-icon.png
    - assets/audio/tts/
